name: Build

on:
    pull_request: null
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4

            -   uses: actions/setup-go@v5
                with:
                    go-version: 'stable'

            -   run: gofmt -l . | tee /tmp/gofmt.out && test ! -s /tmp/gofmt.out

            -   run: go vet ./...

            -   run: go build ./...

            -   run: go test ./...
