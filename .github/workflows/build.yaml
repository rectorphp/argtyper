name: Build

on:
    pull_request: null
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4

            -   uses: actions/setup-go@v5
                with:
                    go-version: 'stable'

            -   run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
                name: gofmt

            -   run: go vet ./...

            -   run: go build ./...

            -   run: go test -race ./...

            -   run: go mod tidy && git diff --exit-code go.mod go.sum
                name: go mod tidy is up to date
